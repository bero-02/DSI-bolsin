server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dsi_bolsines
spring.datasource.username=postgres
spring.datasource.password=2002
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza las tablas automáticamente a partir de tu modelo OO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API Key simulada para el GPS Tracker XTR-4500L
gps.api.key=XTR-SECRET-KEY-2026